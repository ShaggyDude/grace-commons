title: Grace Commons
description: Atomic Concepts & Conceptual Compositions, expressed as structured natural language. Tests and code are derived; intent is canonical.

image: /OG.png

remote_theme: just-the-docs/just-the-docs

author: Scott Romack

plugins:
  - jekyll-remote-theme

# Just the Docs theme settings
search_enabled: true
heading_anchors: true
color_scheme: dark

# Aux nav (top right)
aux_links:
  "GitHub":
    - "https://github.com/scottromack/grace-commons"

# Footer
footer_content: 'Grace Commons — open foundation for business logic patterns.'

markdown: kramdown

# Mermaid rendering for generated graph views (graph.md). Just the Docs loads it
# from CDN when this key is present.
mermaid:
  version: "10.9.1"

# Derived pattern cards: atoms/ and compositions/ pages get the `pattern` layout
# (which injects _includes/pattern-card.html from _data/patterns.json) via defaults,
# so the canonical pattern files themselves are never edited. Regenerate the data
# with `python3 tools/taxonomy/generate_graph.py .`.
defaults:
  - scope:
      path: "atoms"
    values:
      layout: "pattern"
  - scope:
      path: "compositions"
    values:
      layout: "pattern"

exclude:
  - AGENTS.md
  - CLAUDE.md
  - demos/
  - grants/
  - internal/
  - node_modules/
  - tools/
  - working-ideas/
