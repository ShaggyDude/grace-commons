name: Lint spec corpus

# The mechanical cross-reference gate (tools/linter/README.md): dangling links,
# invariant-count drift, missing models/twins, stale forthcoming-markers, count
# drift, out-of-range invariant references. Stdlib-only, runs in milliseconds,
# exits 1 on any finding.
#
# Follow-ups that ride this same gate when they land: the status-mirror and
# table-duplicate checks (open-questions.md "Status-line grammar"). The
# tools/harness/ and tools/conformance/ gates landed 2026-07-06 as their own
# workflow — see verify.yml; status.md publishes both gates' live state.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Spec-corpus linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run linter
        # Stage-2 vocabulary filtering removed 2026-07-06 per the instruction
        # that stood here: the J/K debt reached 0 (vocabulary sweeps completed
        # 2026-06-18 — see changelog), so the gate is the plain linter again,
        # failing hard on every finding class.
        run: python3 tools/linter/lint.py .
