name: Lint spec corpus

# The mechanical cross-reference gate (tools/linter/README.md): dangling links,
# invariant-count drift, missing models/twins, stale forthcoming-markers, count
# drift, out-of-range invariant references. Stdlib-only, runs in milliseconds,
# exits 1 on any finding.
#
# Follow-ups that ride this same gate when they land: the status-mirror and
# table-duplicate checks (open-questions.md "Status-line grammar"), and a
# scheduled tools/harness/ run once its JRE bootstrap is CI-shaped.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Spec-corpus linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run linter
        # Vocabulary sweep, stage 2 in progress (2026-06-11): J/K findings inside
        # atoms/ and compositions/ are known debt, draining as each pattern's
        # scheduled rescan applies the convention retroactively. The gate still
        # fails hard on every other finding class, and on J/K anywhere else.
        # REMOVE this filtering — restore the plain `python3 tools/linter/lint.py .`
        # — when the reported debt count reaches 0.
        run: |
          python3 tools/linter/lint.py . > lint.out || true
          if grep -vE 'J-banned-token|K-output-noun' lint.out | grep -q .; then
            echo "::error::lint findings (non-vocabulary):"
            grep -vE 'J-banned-token|K-output-noun' lint.out
            exit 1
          fi
          if grep -E 'J-banned-token|K-output-noun' lint.out | grep -vE '^(atoms|compositions)/' | grep -q .; then
            echo "::error::vocabulary findings outside the pattern dirs (not stage-2 debt):"
            grep -E 'J-banned-token|K-output-noun' lint.out | grep -vE '^(atoms|compositions)/'
            exit 1
          fi
          echo "stage-2 vocabulary debt (pattern dirs, draining on the rescan cadence): $(grep -cE 'J-banned-token|K-output-noun' lint.out) finding(s)"
