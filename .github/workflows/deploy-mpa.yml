name: Deploy Multi-Party Approval to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "demos/multi-party-approval/**"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        working-directory: demos/multi-party-approval
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
