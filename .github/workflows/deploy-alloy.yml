name: Deploy Attributed Permissions Admin to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "demos/attributed-permissions-admin/**"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        working-directory: demos/attributed-permissions-admin
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
