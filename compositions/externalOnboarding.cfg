SPECIFICATION Spec

INVARIANT Safety

CHECK_DEADLOCK FALSE

\* Suggested constant values for a tractable TLC run.
\* Set these in your TLC model configuration (Toolbox or command line):
\*
\*   CONSTANTS
\*     NULL          = "_none_"
\*     Actors        = {a1, a2}
\*     InvitationIds = {i1, i2}
\*     PartyIds      = {p1, p2}
\*     CredentialIds = {c1, c2}
\*     MaxClock      = 3
\*
\* To run from the command line:
\*   java -jar tla2tools.jar -config external-onboarding.cfg \
\*        -workers 4 ExternalOnboarding.tla
