SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ApprovalGatesProvisioning
INVARIANT MapInverseConsistency
INVARIANT CascadeFiresAtMostOnce
INVARIANT TokensAllocatedOnlyForProvisioned
INVARIANT NoPendingRequestHasToken
INVARIANT ExhaustedSubsetAllocated

ACTION_CONSTRAINT TerminalAbsorbingAction

CHECK_DEADLOCK FALSE

CONSTANTS
    RequestIDs  = {r1, r2}
    ApproverIDs = {a1, a2, a3}
    CapTokens   = {cap1, cap2}
    QuorumSize  = 2

\* To run from the command line (from compositions/):
\*   java -cp "/Applications/TLA+ Toolbox.app/Contents/Eclipse/tla2tools.jar" \
\*        tlc2.TLC -config privileged-access-provisioning.cfg \
\*        -workers 4 privileged-access-provisioning.tla
