SPECIFICATION Spec

INVARIANT Safety

CHECK_DEADLOCK FALSE

\* NULL is defined as the string "_none_" in the .tla. Assigning it to a
\* model value (NullMV) avoids TLC 2.19 strict-equality failures when
\* NULL is compared against record or set values (same fix as
\* attributed-permissions-admin.cfg).
CONSTANTS
    NULL          = NullMV
    Actors        = {a1, a2}
    InvitationIds = {i1, i2}
    PartyIds      = {p1, p2}
    CredentialIds = {c1, c2}
    \* MaxClock raised 3 -> 6 on 2026-06-03: at MaxClock=3 the reachable state
    \* space was truncated to 44 states (the clock bound capped traces at 3
    \* actions deep before all invitations reached terminal states). The space
    \* saturates at 172 states by MaxClock=4 and is stable thereafter (5, 6 give
    \* the same 172); 6 gives headroom while exploring the complete reachable
    \* space. Safety holds across the full space. See spec Lineage.
    MaxClock      = 6

\* To run from the command line (from compositions/):
\*   java -cp "/Applications/TLA+ Toolbox.app/Contents/Eclipse/tla2tools.jar" \
\*        tlc2.TLC -config external-onboarding.cfg \
\*        -workers 4 external-onboarding.tla
