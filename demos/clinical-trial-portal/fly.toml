# fly.toml app configuration file generated for grace-commons-clinical-trials on 2026-05-22T23:51:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'grace-commons-clinical-trials'
primary_region = 'ams'

[build]

[env]
  DB_PATH = '/data/beacon.sqlite'
  PORT = '8000'

[[mounts]]
  source = 'beacon_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 256
