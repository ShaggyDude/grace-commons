# fly.toml — Beacon Clinical Research demo
# Deploy with: fly launch (first time) or fly deploy (subsequent)
#
# Memory note (from Demo2-plan.md §Phase 6):
#   Argon2id hashing is the only meaningful compute cost. Size at
#   shared-cpu-2x / 1 GB so login and onboarding stay snappy.

app = "grace-commons-beacon"
primary_region = "sjc"

[build]

[env]
  PORT = "8000"
  DB_PATH = "/data/beacon.sqlite"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "beacon_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2
