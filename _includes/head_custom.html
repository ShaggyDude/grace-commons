<!-- Explicit OG and Twitter image tags — backstops jekyll-seo-tag in case it doesn't pick up the site-level image config. -->
<meta property="og:image" content="https://gracecommons.dev/OG.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Grace Commons — Atomic Concepts & Conceptual Compositions, expressed as structured natural language. Tests and code are derived; intent is canonical.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://gracecommons.dev/OG.png">
<style>
    @media (min-width: 66.5rem) {
    .site-nav, .site-header, .site-footer {
            width: 23rem;
        }
    }
    @media (min-width: 50rem) {
    .main {
        max-width: 60rem;
    }
}
</style>
<!-- Root page: override og:title so the OG card headline matches the description's subject. Since 2026-07-06 the root is Start Here (the landing); "Grace Commons" remains the right card headline for it. Sub-pages keep their per-page title. -->
{% if page.url == "/" or page.url == "/home/" %}
<meta property="og:title" content="Grace Commons">
<meta property="twitter:title" content="Grace Commons">
{% endif %}
<script>
  // The site logo links to the vision page (/home/) rather than the root
  // landing (Start Here). Home left the nav menu 2026-07-06 but stays one
  // click away behind the logo; Just the Docs hardwires the site-title href
  // to the root, and this hook retargets it without copying the theme's
  // sidebar internals.
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('a.site-title').forEach(function (a) {
      a.href = '{{ "/home/" | relative_url }}';
    });
  });
</script>
