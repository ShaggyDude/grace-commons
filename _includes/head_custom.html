<!-- Explicit OG and Twitter image tags — backstops jekyll-seo-tag in case it doesn't pick up the site-level image config. -->
<meta property="og:image" content="https://gracecommons.dev/OG.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Grace Commons — Atomic patterns (concepts) and applications, expressed as structured natural language. Code is derived; intent is canonical.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://gracecommons.dev/OG.png">
<!-- Home page: override og:title so the OG card headline matches the description's subject (avoids "Home" as headline when description is about Grace Commons). Sub-pages keep their per-page title. -->
{% if page.url == "/" %}
<meta property="og:title" content="Grace Commons">
<meta property="twitter:title" content="Grace Commons">
{% endif %}
