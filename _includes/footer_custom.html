<!-- _includes/footer_custom.html — Custom footer
     Rendered at the bottom of every page's main content (Just the Docs).
     Docs: https://just-the-docs.com/docs/customization/#custom-footer
 -->

<style>
  .to-top {
    position: fixed;
    right: 2rem;
    bottom: 2rem;
    width: 3rem;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #32323257;
    color: #fff;
    text-decoration: none;
    line-height: 1;
    box-shadow: 0 0 1rem rgb(0 0 0 / .2);
    transition: background .6s ease-out, box-shadow .3s ease-out;
    opacity: 0;
    visibility: hidden;
    animation: to-top-show ease-out both;
    animation-timeline: scroll(root);
    animation-range: 200px 400px;
    backdrop-filter: blur(4px);
    corner-shape: squircle;
    border: 1px solid #fff1;
  }

  .to-top:hover,
  .to-top:focus-visible {
    background: #1114;
    box-shadow: 0 0 1rem rgb(0 0 0 / .5);
  }

  @keyframes to-top-show {
    from { opacity: 0; visibility: hidden; }
    to   { opacity: 1; visibility: visible; }
  }

  /* Fallback: browsers without scroll-driven animations show it always,
     otherwise the button would stay hidden forever. */
  @supports not (animation-timeline: scroll()) {
    .to-top {
      opacity: 1;
      visibility: visible;
      animation: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .to-top { transition: none; }
  }
</style>

<a class="to-top" href="#top" aria-label="Back to top">↑</a>
