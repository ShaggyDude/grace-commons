<!-- _includes/footer_custom.html — Custom footer
     Rendered at the bottom of every page's main content (Just the Docs).
     Docs: https://just-the-docs.com/docs/customization/#custom-footer

     Content: a pure-CSS "back to top" button. It is position:fixed, so it
     floats bottom-right on every page rather than sitting in the footer flow.
     Reveal is driven by a scroll-timeline animation (no JavaScript).
     `href="#top"` scrolls to the top of the page (browsers treat the "#top"
     fragment specially, so no explicit top anchor is required). -->

<style>
  .to-top {
    position: fixed;
    right: 2rem;
    bottom: 2rem;
    width: 3rem;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: #222;
    color: #fff;
    text-decoration: none;
    line-height: 1;
    box-shadow: 0 .5rem 1rem rgb(0 0 0 / .5);
    transition: background .6s ease-out, box-shadow .8s ease-out;
    opacity: 0;
    visibility: hidden;
    animation: to-top-show linear both;
    animation-timeline: scroll(root);
    animation-range: 200px 400px;
  }

  .to-top:hover,
  .to-top:focus-visible {
    background: #444;
    box-shadow: 0 .5rem 1rem rgb(0 0 0 / 1);
    opacity: .8;
  }

  @keyframes to-top-show {
    from { opacity: 0; visibility: hidden; }
    to   { opacity: .8; visibility: visible; }
  }

  /* Fallback: browsers without scroll-driven animations show it always,
     otherwise the button would stay hidden forever. */
  @supports not (animation-timeline: scroll()) {
    .to-top {
      opacity: .8;
      visibility: visible;
      animation: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .to-top { transition: none; }
  }
</style>

<a class="to-top" href="#top" aria-label="Back to top">↑</a>
